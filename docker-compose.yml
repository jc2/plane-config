version: '3.9'

services:
  # PostgreSQL database for Plane
  db:
    image: postgres:15-alpine
    container_name: plane-db
    restart: unless-stopped
    volumes:
      - plane_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: plane-redis
    restart: unless-stopped
    volumes:
      - plane_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Plane Backend API
  backend:
    image: makeplane/plane-backend:latest
    container_name: plane-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - plane_uploads:/uploads
    environment:
      # Database
      DATABASE_URL: postgresql://plane:${DB_PASSWORD}@db:5432/plane

      # Redis
      REDIS_URL: redis://redis:6379

      # Django
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}

      # API
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Email (optional for POC)
      EMAIL_BACKEND: console
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Plane Frontend
  web:
    image: makeplane/plane-frontend:latest
    container_name: plane-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Plane Worker (background jobs)
  worker:
    image: makeplane/plane-worker:latest
    container_name: plane-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://plane:${DB_PASSWORD}@db:5432/plane
      REDIS_URL: redis://redis:6379
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - plane_uploads:/uploads

  # Database migrator (runs once on first deploy, then skips)
  migrator:
    image: makeplane/plane-backend:latest
    container_name: plane-migrator
    restart: no
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://plane:${DB_PASSWORD}@db:5432/plane
      REDIS_URL: redis://redis:6379
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput"
    volumes:
      - plane_uploads:/uploads

volumes:
  plane_pgdata:
  plane_redisdata:
  plane_uploads:
